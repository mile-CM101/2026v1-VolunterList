<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 
    ========================================================================
    [系統版本更新歷程]
    - V5.0 (目前版本) : 
        1. 修正參與排班統計 (StatsModal) 中姓名因空間擠壓而斷行的問題 (加入 shrink-0 與 whitespace-nowrap)。
    - V4.9 : 
        1. 新增 parseAndCleanNames 函式，自動過濾結尾的「教練」、「助教」、「老師」等職稱，精準合併同一人的排班統計。
        2. UI 提示文字補齊所有 10 個志工單位（含：道場功法、大正功法等）。
    - V4.8 : 新增 RosterModal(排班名單)、StatsModal(參與排班統計) 與匯出 TXT 功能。
    - V4.6 : 修復手機端 TXT 亂碼(加入 BOM)，新增 LocalStorage 記住密碼功能。
    - V4.5 : 新增 bg-slate-100 作為背景圖失效時的備援。
    - V4.3 : 全域統一背景圖設定 (bk.jpg)，設定透明度 30%。
    - V4.1 : 實作 Base64 密碼防護閘道。
    ========================================================================
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
        /* 隱藏滾動條但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
          display: none;
        }
        .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.3s ease-out forwards;
        }
        @keyframes fadeIn {

            to { opacity: 1; }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;

        /* 自訂滾動條樣式，讓 Modal 內容滾動更美觀 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {

        }

</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import * as LucideIcons from 'lucide-react';

        // ========== Icon 元件 ==========
        const Icon = ({ name, className = "", ...props }) => {
            const IconComponent = LucideIcons[name];
            if (!IconComponent) return null;
            return <IconComponent className={className} {...props} />;
        };

        const APP_VERSION = "App v5.0.0 (UI Polish)"; 
        const DEFAULT_DATA_VERSION = "Data 2026 (Embedded)";

        // --- 輔助函式 ---
        const normalizeDate = (dateStr) => {
            if (!dateStr) return "";
            if (dateStr.match(/^\d{4}\/\d{1,2}\/\d{1,2}/)) {
                const cleanDate = dateStr.split(' ')[0];
                const parts = cleanDate.split('/');
                return `${parts[0]}/${parts[1].padStart(2, '0')}/${parts[2].padStart(2, '0')}`;
            }
            const match = dateStr.match(/(\d{1,2})\/(\d{1,2})/);
            if (match) {
                return `2026/${match[1].padStart(2, '0')}/${match[2].padStart(2, '0')}`;
            }
            return dateStr;
        };

        const ensureYearInString = (dateStr) => {
            if (!dateStr) return "";
            const str = String(dateStr).trim();
            if (!str.match(/^\d{4}/)) {
                return `2026/${str}`;
            }
            return str;
        };

        // 清理姓名：過濾括號與特定職稱 (教練、助教、老師)
        const parseAndCleanNames = (rawName) => {
            if (!rawName || rawName === "待定") return [];
            const parts = String(rawName).split(/[,\s]+/);
            const res = [];
            parts.forEach(p => {
                let t = p.trim();
                // 過濾空字串與括號開頭的註解 (如: (大正))
                if (t && !t.startsWith('(') && !t.startsWith('（')) {
                    // 過濾結尾的教練、助教、老師
                    t = t.replace(/(教練|助教|老師)$/, '');
                    if (t) res.push(t); // 確認清理後不是空字串才加入
                }
            });
            return res;
        };

        // --- 內建完整資料 (部署版專用) ---
        const EMBEDDED_DHARMA_DATA = [
            { "date": "2026/01/11", "title": "嚴聖尊佛成道日法會", "location": "新竹 冥聖九華山大地藏王佛玄皇寺" },
            { "date": "2026/01/25", "title": "嚴仁尊佛成道日法會", "location": "新竹 冥聖九華山大地藏王佛玄皇寺" },
            { "date": "2026/02/17", "title": "彌勒尊佛佛誕日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/03/07", "title": "皇母聖道日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/03/08", "title": "皇母聖道日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/03/28", "title": "皇母聖誕日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/03/29", "title": "皇母聖誕日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/04/12", "title": "清明祈福法會", "location": "新竹 冥聖九華山大地藏王佛玄皇寺" },
            { "date": "2026/04/26", "title": "盤古尊佛成道日法會", "location": "深坑 大正金剛轉輪寺" },
            { "date": "2026/05/09", "title": "媽祖天后聖誕日法會", "location": "台南 彌勒三皇母寶殿九龍媽祖廟" },
            { "date": "2026/06/28", "title": "嚴慈尊佛成道日法會", "location": "新竹 冥聖九華山大地藏王佛玄皇寺" },
            { "date": "2026/08/01", "title": "皇母出家日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/08/02", "title": "皇母出家日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/08/30", "title": "中元普渡祈福法會", "location": "新竹 冥聖九華山大地藏王佛玄皇寺" },
            { "date": "2026/10/17", "title": "媽祖天后成道日法會", "location": "台南 彌勒三皇母寶殿九龍媽祖廟" },
            { "date": "2026/10/31", "title": "皇母成道日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/11/01", "title": "皇母成道日法會", "location": "新店 陀彌天山紫竹林寺" },
            { "date": "2026/12/27", "title": "嚴聖尊佛成道日法會", "location": "新店 陀彌天山紫竹林寺" }
        ];

        // --- 1. 排班名單彈窗 (Modal) ---
        const RosterModal = ({ isOpen, onClose, data, searchUnit }) => {
            if (!isOpen) return null;

            // 計算目前選定單位的獨特人名，並加入過濾邏輯
            const roster = useMemo(() => {
                let filteredData = data;
                if (searchUnit !== '所有單位') {
                    filteredData = data.filter(item => item.type === searchUnit);
                }
                
                const nameSet = new Set();
                filteredData.forEach(item => {
                    const cleanNames = parseAndCleanNames(item.name);
                    cleanNames.forEach(n => nameSet.add(n));
                });

                return Array.from(nameSet).sort((a, b) => a.localeCompare(b, 'zh-TW'));
            }, [data, searchUnit]);

            // 匯出當前顯示的名單
            const handleExportRoster = () => {
                if (roster.length === 0) return;
                const unitName = searchUnit === '所有單位' ? '全體' : searchUnit;
                let content = `\uFEFF排班人員名單 - ${unitName} (${roster.length} 人)\n`;
                content += `匯出時間: ${new Date().toLocaleString()}\n`;
                content += `----------------------------------------------------------\n`;
                roster.forEach((name, idx) => {
                    content += `${idx + 1}. ${name}\n`;
                });
                
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Roster_${unitName}.txt`;
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-all" onClick={onClose}>
                    <div 
                        className="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]"
                        onClick={e => e.stopPropagation()}
                    >
                        <div className="bg-indigo-600 px-6 py-4 flex justify-between items-center shrink-0">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icon name="Users" className="w-5 h-5 text-indigo-100" />
                                {searchUnit === '所有單位' ? '全體排班名單' : `${searchUnit} 排班名單`}
                            </h3>
                            <button 
                                onClick={onClose}
                                className="text-indigo-100 hover:text-white hover:bg-indigo-700/50 p-1.5 rounded-full transition-colors"
                            >
                                <Icon name="X" className="w-6 h-6" />
                            </button>
                        </div>

                        <div className="p-6 overflow-y-auto custom-scrollbar flex-grow bg-slate-50">
                            <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-200 text-slate-500 text-sm">
                                <span>名單總計: <strong className="text-indigo-600">{roster.length}</strong> 人</span>
                            </div>
                            
                            {roster.length === 0 ? (
                                <div className="text-center text-slate-400 py-8">
                                    此單位目前沒有排班人員資料
                                </div>
                            ) : (
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                    {roster.map((name, idx) => (
                                        <div key={idx} className="bg-white border border-slate-200 rounded-lg px-3 py-2 text-center text-slate-700 font-medium shadow-sm flex items-center justify-center gap-1.5 hover:border-indigo-300 transition-colors">
                                            <Icon name="User" className="w-3.5 h-3.5 text-slate-400" />
                                            <span className="truncate">{name}</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <div className="bg-slate-50 border-t border-slate-200 p-4 shrink-0 flex justify-end gap-3">
                             <button 
                                onClick={handleExportRoster}
                                disabled={roster.length === 0}
                                className="bg-slate-100 border border-slate-300 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg shadow-sm transition-colors font-medium flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed"
                             >
                                <Icon name="Download" className="w-4 h-4" />
                                輸出檔案
                             </button>
                             <button 
                                onClick={onClose}
                                className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-6 py-2 rounded-lg shadow-sm transition-colors font-medium"
                             >
                                關閉
                             </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 2. 參與排班統計彈窗 (Modal) ---
        const StatsModal = ({ isOpen, onClose, data }) => {
            if (!isOpen) return null;

            // 計算每個人參與了幾種不同的單位
            const userStats = useMemo(() => {
                const statsMap = new Map(); // key: 姓名, value: Set(參與過的單位)

                data.forEach(item => {
                    const cleanNames = parseAndCleanNames(item.name);
                    cleanNames.forEach(n => {
                        if (!statsMap.has(n)) {
                            statsMap.set(n, new Set());
                        }
                        statsMap.get(n).add(item.type);
                    });
                });

                // 將 Map 轉成陣列並排序 (先按參與單位數量降序，再按姓名筆畫)
                const statsArray = Array.from(statsMap.entries()).map(([name, unitsSet]) => ({
                    name: name,
                    unitsCount: unitsSet.size,
                    unitsList: Array.from(unitsSet).sort()
                }));

                statsArray.sort((a, b) => {
                    if (b.unitsCount !== a.unitsCount) {
                        return b.unitsCount - a.unitsCount; // 數量多的在前面
                    }
                    return a.name.localeCompare(b.name, 'zh-TW'); // 數量相同按姓名排序
                });

                return statsArray;
            }, [data]);

            const handleExportStats = () => {
                if (userStats.length === 0) return;
                let content = `\uFEFF參與排班統計名單 (${userStats.length} 人)\n`;
                content += `匯出時間: ${new Date().toLocaleString()}\n`;
                content += `----------------------------------------------------------\n`;
                content += `姓名\t\t參與單位數\t\t參與單位明細\n`;
                content += `----------------------------------------------------------\n`;
                userStats.forEach((stat) => {
                    content += `${stat.name}\t\t${stat.unitsCount}\t\t${stat.unitsList.join(', ')}\n`;
                });
                
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Volunteer_Stats.txt`;
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-all" onClick={onClose}>
                    <div 
                        className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]"
                        onClick={e => e.stopPropagation()}
                    >
                        <div className="bg-teal-600 px-6 py-4 flex justify-between items-center shrink-0">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icon name="BarChart2" className="w-5 h-5 text-teal-100" />
                                參與排班單位統計
                            </h3>
                            <button 
                                onClick={onClose}
                                className="text-teal-100 hover:text-white hover:bg-teal-700/50 p-1.5 rounded-full transition-colors"
                            >
                                <Icon name="X" className="w-6 h-6" />
                            </button>
                        </div>

                        <div className="p-6 overflow-y-auto custom-scrollbar flex-grow bg-slate-50">
                            <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-200 text-slate-500 text-sm">
                                <span>總計參與志工: <strong className="text-teal-600">{userStats.length}</strong> 人</span>
                                <span className="text-xs text-slate-400">依參與單位數量排序</span>
                            </div>
                            
                            {userStats.length === 0 ? (
                                <div className="text-center text-slate-400 py-8">
                                    目前沒有排班資料
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {userStats.map((stat, idx) => (
                                        <div key={idx} className="bg-white border border-slate-200 rounded-lg p-3 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-2 hover:border-teal-300 transition-colors">
                                            {/* 加入 shrink-0 確保左側姓名區塊不會被壓縮 */}
                                            <div className="flex items-center gap-3 shrink-0">
                                                <div className="bg-teal-50 w-8 h-8 rounded-full flex items-center justify-center text-teal-600 font-bold shrink-0">
                                                    {stat.unitsCount}
                                                </div>
                                                {/* 加入 whitespace-nowrap 強制姓名不換行 */}
                                                <span className="font-bold text-slate-700 text-lg whitespace-nowrap">{stat.name}</span>
                                            </div>
                                            <div className="flex flex-wrap gap-1.5 pl-11 sm:pl-0 sm:justify-end">
                                                {stat.unitsList.map((unit, uIdx) => (
                                                    <span key={uIdx} className="bg-slate-100 text-slate-600 text-xs px-2 py-1 rounded">
                                                        {unit}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <div className="bg-slate-50 border-t border-slate-200 p-4 shrink-0 flex justify-end gap-3">
                             <button 
                                onClick={handleExportStats}
                                disabled={userStats.length === 0}
                                className="bg-slate-100 border border-slate-300 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg shadow-sm transition-colors font-medium flex items-center gap-1.5 disabled:opacity-50 disabled:cursor-not-allowed"
                             >
                                <Icon name="Download" className="w-4 h-4" />
                                輸出檔案
                             </button>
                             <button 
                                onClick={onClose}
                                className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-6 py-2 rounded-lg shadow-sm transition-colors font-medium"
                             >
                                關閉
                             </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 法會日期彈窗 (Modal) ---
        const DharmaModal = ({ isOpen, onClose, data, isLoading, error }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-all" onClick={onClose}>
                    <div 
                        className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]"
                        onClick={e => e.stopPropagation()}
                    >
                        {/* Modal Header */}
                        <div className="bg-gradient-to-r from-amber-500 to-amber-600 px-6 py-4 flex justify-between items-center shrink-0">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                <Icon name="Sparkles" className="w-5 h-5 text-amber-100" />
                                2026 法會日期一覽
                            </h3>
                            <button 
                                onClick={onClose}
                                className="text-amber-100 hover:text-white hover:bg-amber-700/50 p-1.5 rounded-full transition-colors"
                            >
                                <Icon name="X" className="w-6 h-6" />
                            </button>
                        </div>

                        {/* Modal Body */}
                        <div className="p-0 overflow-y-auto custom-scrollbar flex-grow bg-slate-50">
                            {isLoading ? (
                                <div className="flex flex-col items-center justify-center h-64 text-slate-500 gap-3">
                                    <Icon name="Loader" className="w-8 h-8 animate-spin text-amber-500" />
                                    <p>正在讀取法會資料...</p>
                                </div>
                            ) : data.length === 0 ? (
                                <div className="p-8 text-center text-slate-500">暫無資料</div>
                            ) : (
                                <div className="divide-y divide-slate-200">
                                    {data.map((item, index) => (
                                        <div key={index} className="bg-white p-4 hover:bg-amber-50 transition-colors flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-6 border-b border-slate-100 last:border-0">
                                            {/* 日期區塊 */}
                                            <div className="flex items-center gap-2 sm:w-32 shrink-0">
                                                <div className="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded uppercase tracking-wider">
                                                    DATE
                                                </div>
                                                <span className="font-mono font-bold text-slate-700 text-lg">
                                                    {item.date}
                                                </span>
                                            </div>

                                            {/* 內容區塊 */}
                                            <div className="flex-grow">
                                                <h4 className="font-bold text-slate-800 text-base mb-1">
                                                    {item.title}
                                                </h4>
                                                <div className="flex items-center gap-1.5 text-sm text-slate-500">
                                                    <Icon name="MapPin" className="w-3.5 h-3.5 text-slate-400" />
                                                    {item.location}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {error && (
                                <div className="bg-orange-50 p-4 text-center border-t border-orange-100">
                                    <p className="text-xs text-orange-600 flex items-center justify-center gap-1">
                                        <Icon name="Info" className="w-3 h-3" />
                                        注意：目前顯示的是內建備用資料 ({error})
                                    </p>
                                </div>
                            )}
                        </div>
                        
                        {/* Modal Footer */}
                        <div className="bg-slate-50 border-t border-slate-200 p-4 shrink-0 text-center text-xs text-slate-400 flex justify-between items-center">
                             <span>資料來源: {error ? '內建備份' : 'Embedded Data'}</span>
                             <button 
                                onClick={onClose}
                                className="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-4 py-1.5 rounded shadow-sm transition-colors"
                             >
                                關閉
                             </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 月曆元件 ---

    const isBefore = /之前|以前|前還有/.test(question);
    const isUntil = /以前|截至|以前為止|之前為止/.test(question);

    const getDateKey = (item) => {
        const raw = String(item.date || item.rawDate || "");
        const m = raw.match(/((?:19|20)\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
        if (!m) return "";
        return `${m[1]}/${String(m[2]).padStart(2, "0")}/${String(m[3]).padStart(2, "0")}`;
    };

    const monthMatch = question.match(/(?:20\d{2}\s*年?)?\s*(1[0-2]|0?[1-9])\s*月/);
    const month = monthMatch ? Number(monthMatch[1]) : null;

    // 法會資料查詢
    const asksDharma = /法會|佛誕|成道|皇母|祈福|普渡/.test(q);
    if (asksDharma) {

            found = found.filter(item => {
                const raw = String(item.date || "");
                const m = raw.match(/((?:19|20)\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
                if (!m) return false;
                const key = `${m[1]}/${String(m[2]).padStart(2, "0")}/${String(m[3]).padStart(2, "0")}`;
                if (isAfter) return key > targetDate;
                if (isFrom) return key >= targetDate;
                if (isBefore) return key < targetDate;
                if (isUntil) return key <= targetDate;
                return key === targetDate;
            });
        } else if (month) {
            found = found.filter(item => {
                const m = String(item.date || "").match(/[\/.-](\d{1,2})[\/.-]/);
                return m && Number(m[1]) === month;
            });
        }

        const keyword = question.replace(/20\d{2}|[0-9]{1,2}[\/.-][0-9]{1,2}|[0-9]{1,2}月|之後|以後|過後|有哪些|法會|查詢|請問/g, "").trim();
        if (keyword.length >= 2) {
            const k = clean(keyword);
            const narrowed = found.filter(item =>
                clean(item.title).includes(k) || clean(item.location).includes(k)
            );
            if (narrowed.length) found = narrowed;
        }

        found.sort((a, b) => String(a.date).localeCompare(String(b.date)));
        if (!found.length) return "法會資料中沒有找到符合條件的項目。";
        return `找到 ${found.length} 筆法會資料：\n\n` +

    }

    // 先找使用者提到的姓名。item.name 可能是一整串多人名單，
    // 因此採「包含姓名」而不是 item.name === 姓名。
    const allNameCandidates = [...new Set(data.flatMap(item =>
        String(item.name || "")
            .split(/[，,、\n]+/)
            .map(part => part.replace(/[（(].*?[）)]/g, "").trim())
            .filter(Boolean)
    ))];

    const matchedName = allNameCandidates
        .filter(name => clean(name).length >= 2 && q.includes(clean(name)))
        .sort((a, b) => clean(b).length - clean(a).length)[0];

    let found = data.slice();

    // 日期條件：日期區間優先於單月條件
    if (targetDate) {
        found = found.filter(item => {
            const key = getDateKey(item);
            if (!key) return false;
            if (isAfter) return key > targetDate;
            if (isFrom) return key >= targetDate;
            if (isBefore) return key < targetDate;
            if (isUntil) return key <= targetDate;
            return key === targetDate;
        });
    } else if (month) {
        found = found.filter(item => {
            const key = getDateKey(item);
            return key && Number(key.split("/")[1]) === month;
        });
    }

    // 單位條件
    const unit = availableUnits
        .filter(u => u && u !== "所有單位")
        .sort((a, b) => clean(b).length - clean(a).length)
        .find(u => q.includes(clean(u)));
    if (unit) found = found.filter(item => item.type === unit);

    // 姓名條件：可命中「彌勒澄明（第二層24辦）」這類多人合併欄位
    if (matchedName) {
        found = found.filter(item => clean(item.name).includes(clean(matchedName)));
    }

    // 內容關鍵字（只有在未辨識姓名、單位、日期時才作為備援）
    if (!matchedName && !unit && !targetDate && !month) {
        const stopWords = ["查詢", "幫我", "請問", "多少", "幾筆", "排班", "服務", "資料", "志工", "今年", "有哪些", "有多少", "名單", "還有"];
        const tokens = String(question)
            .replace(/[，。！？、,.!?]/g, " ")
            .split(/\s+/)
            .filter(t => t.length >= 2 && !stopWords.includes(t) && !/^\d+$/.test(t));

        if (token) {

            const byText = found.filter(item =>

                clean(item.content).includes(key) ||

    found.sort((a, b) => getDateKey(a).localeCompare(getDateKey(b)));

    const uniqueNames = new Set(found.map(item => item.name)).size;

    if (/幾次|幾筆|次數|總共|統計|多少/.test(q) && matchedName) {
        const units = [...new Set(found.map(item => item.type))];
        return `📊 ${matchedName} 的排班統計\n\n• 排班筆數：${total} 筆\n• 服務日期：${uniqueDates} 天\n• 參與單位：${units.join("、")}\n\n` +
            found.slice(0, 20).map(item => `• ${item.rawDate || item.date}｜${item.type}｜${item.role || "志工"}｜${item.name}`).join("\n");
    }

    const list = found.slice(0, 20).map(item =>
        `• ${item.rawDate || item.date}｜${item.type}｜${item.name}${item.role ? "｜" + item.role : ""}${item.content ? "｜" + item.content : ""}`
    ).join("\n");

    return `🔎 ${summary}\n\n${list}${total > 20 ? `\n\n還有 ${total - 20} 筆，請增加單位或日期條件縮小範圍。` : ""}`;
};

                            <Icon name="X" className="w-5 h-5" />
                        </button>
                    </header>

                    <div className="flex-1 overflow-y-auto p-3 space-y-3 bg-slate-50">

                            回答依目前載入的志工 JSON 資料產生，不使用外部 AI API

                        type: entry.type,

                                        <td className="px-6 py-4 whitespace-nowrap text-sm">
                                          <span className={`px-2 inline-flex text-xs leading-5 font-semibold rounded-full 
                                            ${item.type.includes('大愛') ? 'bg-pink-100 text-pink-800' : 
                                              item.type.includes('大佛手') ? 'bg-blue-100 text-blue-800' : 
                                              item.type.includes('護衛隊') ? 'bg-gray-100 text-gray-800' :
                                              'bg-purple-100 text-purple-800'}`}>
                                            {item.type}
                                          </span>
                                        </td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-slate-700 font-bold">{item.name}</td>
                                        <td className="px-6 py-4 text-sm text-slate-500">
                                          {item.role}
                                          {item.content && <span className="ml-2 text-slate-400">({item.content})</span>}
                                        </td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            ))}
                          </div>
                        </div>
                    </main>

                    <footer className="bg-slate-100 border-t border-slate-200 mt-auto py-6 shrink-0">
                        <div className="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center text-slate-500 text-sm gap-2">
                          <p>© 2026 志工排班管理系統 </p>
                          <div className="flex items-center gap-2 bg-slate-200 px-3 py-1 rounded-full text-slate-600 font-medium">
                             <Icon name="Database" className="w-4 h-4" />
                             <span>資料庫總筆數: {flattenedData.length} 筆</span>
                          </div>
                        </div>
                    </footer>
                    </div>
                </div>
            );
        };

        // 啟動 React
        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
